name: Build Diwan APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Project
        run: |
          mkdir -p app/src/main/java/com/diwan/app app/src/main/res/values gradle/wrapper
          printf 'rootProject.name = "Diwan"\ninclude(":app")\n' > settings.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
          chmod +x gradlew
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.diwan.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.diwan.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
          }
          EOF
          printf '<resources><string name="app_name">ديوان</string></resources>\n' > app/src/main/res/values/strings.xml
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="@string/app_name" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>\n' > app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/java/com/diwan/app/MainActivity.kt
          package com.diwan.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme {
                              var subject by remember { mutableStateOf("طلب إجازة لمدير الدائرة") }
                              var letter by remember { mutableStateOf("") }
                              Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  Text("ديوان", style = MaterialTheme.typography.headlineMedium)
                                  OutlinedTextField(value = subject, onValueChange = { subject = it }, label = { Text("الموضوع") }, modifier = Modifier.fillMaxWidth())
                                  Button(onClick = {
                                      letter = "بسم الله الرحمن الرحيم\nسعادة المدير الموقر،\nالسلام عليكم ورحمة الله وبركاته،،\nأرفع إليكم بخصوص ($subject) راجياً التفضل بالاطلاع والموافقة.\nوتفضلوا بقبول فائق الاحترام،،"
                                  }, modifier = Modifier.fillMaxWidth()) { Text("توليد الخطاب") }
                                  if (letter.isNotEmpty()) {
                                      Text(letter)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: diwan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
