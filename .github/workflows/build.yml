name: Build Diwan APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Project
        run: |
          mkdir -p app/src/main/java/com/diwan/app app/src/main/res/layout app/src/main/res/values gradle/wrapper
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Diwan"
          include(":app")
          EOF
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew -o gradlew
          chmod +x gradlew
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.diwan.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.diwan.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ديوان</string>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:layoutDirection="rtl"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="ديوان — محرر الخطابات الرسمية"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="12dp" />

                  <EditText
                      android:id="@+id/etSubject"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="اكتب موضوع الخطاب هنا..."
                      android:text="طلب إجازة اعتيادية لمدير الدائرة"
                      android:layout_marginBottom="12dp" />

                  <Button
                      android:id="@+id/btnGenerate"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="إنشاء الخطاب"
                      android:layout_marginBottom="16dp" />

                  <TextView
                      android:id="@+id/tvResult"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="16sp"
                      android:lineSpacingExtra="4dp" />

              </LinearLayout>
          </ScrollView>
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/diwan/app/MainActivity.kt
          package com.diwan.app

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val etSubject = findViewById<EditText>(R.id.etSubject)
                  val btnGenerate = findViewById<Button>(R.id.btnGenerate)
                  val tvResult = findViewById<TextView>(R.id.tvResult)

                  btnGenerate.setOnClickListener {
                      val subj = etSubject.text.toString().trim().ifEmpty { "موضوع رسمي" }
                      tvResult.text = """
                          بسم الله الرحمن الرحيم
                          الموضوع: $subj

                          سعادة المدير الموقر،
                          السلام عليكم ورحمة الله وبركاته،،

                          أرفع إلى سعادتكم هذا الخطاب بشأن ($subj)، راجياً من سعادتكم التكرم بالاطلاع والتوجيه بما ترونه مناسباً.

                          وتفضلوا بقبول فائق الاحترام والتقدير،،

                          مقدّمه: أبو ياسر
                      """.trimIndent()
                  }
              }
          }
          EOF
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: diwan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
